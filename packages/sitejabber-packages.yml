note: >-
  SmartCustomer/Sitejabber publishes no full API client SDK. What it publishes is a set of small
  first-party "utils" libraries that encrypt the customer payload used to build a feedback/review
  link — one each for PHP, Python and Java — from the smartcustomer-reviews GitHub organization.
  Two of the three are on a registry; the Java one is source-only. All three are stale: the newest
  registry release is from 2020, against an API reference that is still being updated (the
  business-api-docs repo was last pushed 2026-07-23). That gap is the finding.
