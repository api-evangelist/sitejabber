note: >-
  SmartCustomer ships an embeddable widget library — the client-side surface businesses install on
  their own storefront to display and collect reviews. It is distinct from the REST API and distinct
  from the payload-encryption packages in packages/. The widget catalog is described qualitatively on
  the marketing site; no loader script URL, embed snippet, attribute reference or per-widget
  documentation is published publicly (install instructions live behind the business account), so the
  families below are recorded WITHOUT invented embed code.
