rebrand:
  from: Sitejabber (sitejabber.com)
  to: SmartCustomer (smartcustomer.com)
  api_impact: >-
    The rebrand is INCOMPLETE on the API surface and this is the most consequential lifecycle fact
    for a consumer. The reference is served from the old host api.sitejabber.com, and the same
    content is served from api.smartcustomer.com; the servers block and every code sample in the
    reference use api.smartcustomer.com. The first-party packages, their namespaces (Sitejabber\Utils,
