undocumented_surfaces:
  note: >-
    The business web app preconnects to two hosts that are NOT part of the documented API and are NOT
    recorded as APIs in apis.yml. Noted here so a later pass does not mistake them for a public
    contract. SmartCustomer's own llms.txt explicitly instructs agents not to treat internal API
    routes as public documentation, and that instruction is honored here.
  observed:
  - host: https://api.smartcustomer.com/v2
    seen_in: preconnect hint on https://www.smartcustomer.com/business/pricing
    probed_status: 200
    probed_body: the same Slate API Reference HTML shell the catch-all serves for every path
    assessment: >-
      An internal v2 used by the business web app. It is undocumented — the public reference at
      api.sitejabber.com documents v1 only, and describes no v2. Its existence is the notable
      finding: v1 is the only version a developer can read, while the vendor's own front end has
      already moved on.
  - host: https://strapi-business.smartcustomer.com/api
    seen_in: preconnect hint on https://www.smartcustomer.com/business/pricing
    probed_status: 404
    probed_body: '{"data":null,"error":{"status":404,"name":"NotFoundError",...}}'
    assessment: >-
      A Strapi CMS instance serving marketing/content data to the business site. The 404 is a genuine
      Strapi error response, confirming the stack, but no collection is public and no
      /documentation or openapi.json is exposed. Content infrastructure, not a product API.
