id_prefixes:
  published: false
  note: No prefixed or opaque identifiers. All IDs are bare integers, or the business domain string.
pii_surface:
  note: >-
    Two endpoints operate directly on customer PII — GET /privacy/access returns a CCPA-category
    breakdown of everything held about a customer email, and POST /privacy/remove deletes it. Both
    are gated on the business having supplied that email. This is the most sensitive part of the
    data model and is why the Privacy tag is separated in the OpenAPI.
