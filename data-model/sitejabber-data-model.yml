summary: >-
  Two parallel review graphs hanging off one Business (Url) root: a CONSUMER review graph
  (Review -> Comment / Message / Question) and a PRODUCT review graph (Product -> ProductReview /
  ProductQuestion -> ProductAnswer). User is the shared vertex — it authors reviews, comments,
  questions and answers on both sides. The two graphs never join: a Review and a ProductReview share
  no identifier, use different id field names (reviewNo vs id) and are returned by different endpoints.
