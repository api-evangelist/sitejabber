name: SiteJabber
description: SiteJabber is a consumer review platform (rebranded as SmartCustomer at smartcustomer.com)
  where shoppers read and write reviews about online businesses and services across categories like
  clothing, electronics, and dating. Operating for over twenty years, it emphasizes consumer protection
  through review moderation and verification, and offers a browser extension that surfaces business
  ratings while users browse. On the business side it is an official Google Review Partner that
  distributes verified reviews to Google Seller Ratings, Google Business profiles, and Google Shopping
  Ads, and provides review-collection widgets and e-commerce integrations. It was surfaced as a
  portfolio company of 500 Global and added to the API Evangelist network. As of this enrichment pass
  no public developer API or API reference was found on the provider's surface.
