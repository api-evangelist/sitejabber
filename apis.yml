name: SiteJabber
description: >-
  SiteJabber is a consumer review platform, rebranded as SmartCustomer at smartcustomer.com, where
  shoppers read and write reviews about online businesses, services and products. Operating for over
  twenty years, it emphasizes consumer protection through review moderation and verification, and
  offers a browser extension that surfaces business ratings while users browse. On the business side
  it is an official Google Review Partner that distributes verified reviews to Google Seller Ratings,
  Google Business profiles and Google Shopping Ads, and it sells review sourcing, moderation,
  showcasing widgets, competitive intelligence and e-commerce integrations across four contact-sales
  packages. It was surfaced as a portfolio company of 500 Global and added to the API Evangelist
  network. It does publish a developer API: the SmartCustomer Business API, a 31-operation REST
  surface documented at api.sitejabber.com covering business ratings, consumer reviews and
  moderation, reviewer messaging, review requests by email and SMS, a full product-review and
  catalog surface, and two CCPA-shaped customer-privacy operations. A prior enrichment pass recorded
  no API; that was wrong — the reference is served from the pre-rebrand api.sitejabber.com host,
  which is not linked from the current consumer or business site navigation.
