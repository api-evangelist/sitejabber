apis:
- name: SmartCustomer (Sitejabber) Business API
  description: >-
    The SmartCustomer Business API (published under the pre-rebrand Sitejabber name at
    api.sitejabber.com) is the review-management API behind SmartCustomer's business product. It
    covers business profile and ratings lookup (single and bulk), business Q&A, consumer reviews
    (read, search by keyword/label/date, publish an unpublished review, flag a review), review
    comments, resolution attempts and direct messaging with reviewers, review requests by email or
    SMS, partner write/edit review links, a full product-reviews surface (catalog CRUD, product Q&A,
    product reviews with photos, votes, top-rated, aggregate stats, product review requests), and two
    CCPA-shaped privacy operations that let a business access or remove a customer's information.
    Authentication is two-part: a client_token API key on every request plus a user_token session
    header obtained from POST /login.
  humanURL: https://api.sitejabber.com/
  baseURL: https://api.smartcustomer.com/v1
